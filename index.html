<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Какая ты фея Винкс?</title>
<link href="https://fonts.googleapis.com/css2?family=Marmelad&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf1f6;--card:#fff;--ink:#3b2a4a;--soft:#7d6a8c;--acc:#e0488f;--acc2:#7a5cf0;--line:#f0d3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1426;--card:#2a1d38;--ink:#f6e9f4;--soft:#b9a5c8;--acc:#ff7ab8;--acc2:#a99bff;--line:#46335a}}
:root[data-theme="dark"]{--bg:#1d1426;--card:#2a1d38;--ink:#f6e9f4;--soft:#b9a5c8;--acc:#ff7ab8;--acc2:#a99bff;--line:#46335a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Marmelad',system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 10%,rgba(224,72,143,.14),transparent 40%),radial-gradient(circle at 90% 80%,rgba(122,92,240,.16),transparent 45%)}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1,h2{font-family:'Pacifico',cursive;font-weight:400;line-height:1.2;margin:0 0 12px}
h1{font-size:clamp(34px,9vw,52px);color:var(--acc)}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:24px 20px}
p{line-height:1.5;font-size:17px;margin:0 0 14px}
.btn{font:inherit;font-size:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .35s}
.cnt{color:var(--soft);font-size:15px;margin-bottom:18px}
.q{font-size:22px;margin-bottom:16px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:18px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--acc);background:rgba(224,72,143,.08)}
.res{text-align:center}
.res img{width:min(100%,380px);height:auto;border-radius:22px;display:block;margin:0 auto 14px}
.res .who{font-size:clamp(30px,8vw,44px);font-family:'Pacifico',cursive;color:var(--acc);margin:6px 0 4px}
.promo{border:2px dashed var(--acc);border-radius:18px;padding:14px;margin:16px 0;font-size:19px}
.promo b{font-size:26px;color:var(--acc2)}
.hide{display:none}
.sub{color:var(--soft)}
</style></head><body><main>
<section id="start" class="card" style="text-align:center">
<h1>Какая ты фея Винкс?</h1>
<p>10 вопросов — и мы узнаем, какая фея Энчантикс живёт в тебе. А в конце тебя ждёт подарок.</p>
<button class="btn" id="go">Начать тест</button>
</section>
<section id="quiz" class="card hide">
<div class="bar"><i id="fill"></i></div>
<div class="cnt" id="cnt"></div>
<div class="q" id="q"></div>
<div id="opts"></div>
</section>
<section id="result" class="card res hide">
<img id="rimg" alt="">
<p class="sub">Ураа! Твой результат:</p>

<p id="rdesc"></p>
<div class="promo">Дарим тебе скидку <b>15%</b> на твою феечку!</div>
<button class="btn" id="again">Пройти ещё раз</button>
</section>
</main>

const Q=[
["Идеальный выходной — это…",{b:"Приключение с друзьями, где всё идёт не по плану",s:"Шопинг и новый образ",f:"Прогулка по саду или парку",m:"Наушники, плейлист и уютный уголок",l:"Тренировка, плавание или танцы"}],
["Какой цвет тебе ближе всего?",{b:"Небесно-голубой",s:"Золотой и оранжевый",f:"Нежно-розовый и зелёный",m:"Глубокий фиолетовый",l:"Бирюзовый и морская волна"}],
["Что о тебе чаще всего говорят друзья?",{b:"«Ты — наше сердце»",s:"«Ты всегда на высоте»",f:"«С тобой так спокойно»",m:"«Ты — загадка»",l:"«На тебя можно положиться»"}],
["Твой любимый способ расслабиться:",{b:"Мороженое и сериал с подругами",s:"Спа-вечер и маска для лица",f:"Чай и уход за растениями",m:"Играть или слушать музыку",l:"Спорт — и голова снова чистая"}],
["Что ты берёшь на долгую прогулку?",{b:"Телефон и хорошее настроение",s:"Любимую сумочку и блеск для губ",f:"Цветы или что-нибудь вкусное для всех",m:"Наушники, конечно",l:"Бутылку воды и удобные кроссовки"}],
["Как ты реагируешь на трудности?",{b:"Не сдаюсь, пока не получится",s:"Верю, что всё сложится — я же везучая!",f:"Сначала успокаиваюсь, потом думаю",m:"Ухожу в себя, а потом — в творчество",l:"Бросаюсь в бой — действовать лучше, чем ждать"}],
["Какая стихия тебе ближе?",{b:"Пламя",s:"Солнце и свет",f:"Природа и растения",m:"Звук и музыка",l:"Вода и волны"}],
["Твоя суперсила в компании друзей:",{b:"Объединять всех вместе",s:"Поднимать настроение и заряжать энергией",f:"Лечить словом и заботой",m:"Находить точные слова и мелодии",l:"Защищать и поддерживать"}],
["Какой образ тебе по душе?",{b:"Лёгкое голубое платье с рюшами",s:"Что-то блестящее и яркое",f:"Воздушное розовое платье",m:"Смелое сочетание, например розовое с золотом",l:"Спортивный и стильный — шорты и топ"}],
["О чём ты мечтаешь больше всего?",{b:"Спасти мир и найти настоящую любовь",s:"Стать звездой и блистать",f:"Чтобы вокруг всё цвело и все были счастливы",m:"Выступить на большой сцене",l:"Путешествовать и быть свободной"}]
];
const K=["b","s","f","m","l"];
let i=0,sc;
const $=id=>document.getElementById(id);
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hide",x!==id));window.scrollTo(0,0)}
function render(){
 $("fill").style.width=(i/Q.length*100)+"%";
 $("cnt").textContent="Вопрос "+(i+1)+" из "+Q.length;
 $("q").textContent=Q[i][0];
 const box=$("opts");box.innerHTML="";
 const ks=[...K].sort(()=>Math.random()-.5);
 ks.forEach(k=>{const b=document.createElement("button");b.className="opt";b.textContent=Q[i][1][k];b.onclick=()=>pick(k);box.appendChild(b)});
}
function pick(k){
 sc[k]++;order.push(k);i++;
 if(i<Q.length)render();else finish();
}
let order=[];
function finish(){
 const max=Math.max(...K.map(k=>sc[k]));
 const top=K.filter(k=>sc[k]===max);
 const win=order.find(k=>top.includes(k));
 const f=F[win];
 $("rimg").src=f.img;$("rimg").alt="Фея "+f.n;
 $("rname").textContent="Ты — "+f.n+"!";
 $("rdesc").textContent=f.d;
 show("result");
}
function start(){i=0;order=[];sc={b:0,s:0,f:0,m:0,l:0};show("quiz");render()}
$("go").onclick=start;$("again").onclick=start;
</script></body></html>
